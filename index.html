<script>
var DATA_VERSION='v24';
(function(){
  var s=document.createElement('script');
  s.src='data.js?v='+DATA_VERSION+'&t='+Date.now();
  s.crossOrigin='anonymous';
  var loaded=false;
  s.onload=function(){
    loaded=true;
    if(typeof INIT_DATA!=='undefined'&&INIT_DATA&&INIT_DATA.knowledge){
      var localData=localStorage.getItem('hxx_data');
      if(localData){
        try{
          var parsed=JSON.parse(localData);
          if(parsed&&parsed.knowledge&&parsed.knowledge.length>INIT_DATA.knowledge.length){
            window.INIT_DATA={knowledge:parsed.knowledge,chapters:extractChapters(parsed.knowledge)};
          }
        }catch(e){}
      }
      init();
    }else{
      tryFallback('数据格式错误');
    }
  };
  s.onerror=function(){
    loaded=true;
    tryFallback('数据加载失败，请检查网络连接<br>或尝试刷新页面');
  };
  document.head.appendChild(s);

  setTimeout(function(){
    if(!loaded){
      s.onerror=s.onload=null;
      tryFallback('数据加载超时，请检查网络连接<br>或尝试刷新页面');
    }
  },10000);

  function tryFallback(msg){
    try{
      var localData=localStorage.getItem('hxx_data');
      if(localData){
        var parsed=JSON.parse(localData);
        if(parsed&&parsed.knowledge&&parsed.knowledge.length>0){
          window.INIT_DATA={knowledge:parsed.knowledge,chapters:extractChapters(parsed.knowledge)};
          init();
          setTimeout(function(){toast('已使用本地缓存数据')},100);
          return;
        }
      }
    }catch(e){}
    document.getElementById('card').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)"><div style="font-size:48px;margin-bottom:10px">&#128260;</div><div>'+msg+'</div><button onclick="location.reload()" style="margin-top:20px;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer">刷新页面</button></div>';
    document.getElementById('swH').style.display='none';
  }

  function extractChapters(knowledge){
    var chs=[];
    knowledge.forEach(function(i){
      if(i.chapter&&chs.indexOf(i.chapter)===-1)chs.push(i.chapter);
    });
    return chs;
  }
})();
</script>

function mergeKnowledge(local,cloud){
  if(!cloud||!cloud.knowledge)return local;
  if(!local||!local.knowledge)return cloud;
  var ck=cloud.knowledge.filter(function(i){return i&&i.id});
  var lk=local.knowledge.filter(function(i){return i&&i.id});
  var cloudById={},localById={};
  ck.forEach(function(k){cloudById[k.id]=k});
  lk.forEach(function(k){localById[k.id]=k});
  var allIds=Object.keys(cloudById);
  Object.keys(localById).forEach(function(id){if(!cloudById[id])allIds.push(id)});
  allIds.sort(function(a,b){var na=Number(a),nb=Number(b);if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a).localeCompare(String(b))});
  var merged=allIds.map(function(id){
    var cl=cloudById[id],lo=localById[id];
    if(!cl)return lo;
    if(!lo)return cl;
    var localChanged=lo.title!==cl.title||lo.chapter!==cl.chapter||lo.category!==cl.category||lo.content!==cl.content||lo.mnemonic!==cl.mnemonic||lo.status!=='未开始'||(lo.mnemonic&&lo.mnemonic.length>0);
    var cloudChanged=cl.title!==lo.title||cl.chapter!==lo.chapter||cl.category!==lo.category||cl.content!==lo.content||cl.mnemonic!==lo.mnemonic||cl.status!=='未开始'||(cl.mnemonic&&cl.mnemonic.length>0);
    if(localChanged&&!cloudChanged)return lo;
    if(!localChanged&&cloudChanged)return cl;
    if(cl.content&&cl.content.length>(lo.content?lo.content.length:0))return cl;
    return lo;
  });
  var chapters=(ck.length>=lk.length)?(cloud.chapters||[]):(local.chapters||[]);
  return{chapters:chapters,knowledge:merged,dict:cloud.dict||{}};
}

function formatRelativeTime(ts){
  if(!ts)return'';
  var now=new Date();var then=new Date(ts);
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var yesterday=today-86400000;
  var thenDay=new Date(then.getFullYear(),then.getMonth(),then.getDate()).getTime();
  var timeStr=String(then.getHours()).padStart(2,'0')+':'+String(then.getMinutes()).padStart(2,'0');
  if(thenDay===today)return'今天 '+timeStr;
  if(thenDay===yesterday)return'昨天 '+timeStr;
  return String(then.getMonth()+1)+'/'+String(then.getDate())+' '+timeStr;
}

  var entries=Object.keys(dictState).map(function(k){var d=dictState[k];return{checked:d.checked,score:d.score,lastCheckTime:d.lastCheckTime,_id:k}}).filter(function(d){return d.checked&&d.score!==null});

  }

      var r=stats.recent[i];
      var scoreCls=r.score>=80?'var(--accent)':r.score>=60?'var(--warn)':'var(--err)';
      h+='<div class="st-rec-item">';
      h+='<span class="st-rec-score" style="color:'+scoreCls+'">'+r.score+'分</span>';
      h+='<div class="st-rec-info">';
      h+='<div class="st-rec-title">'+esc(r.title)+'</div>';
      h+='<div class="st-rec-meta">'+esc(r.chapter)+'</div>';
      h+='</div>';
      h+='<span class="st-rec-time">'+formatRelativeTime(r.time)+'</span>';
      h+='</div>';
    }
    h+='</div>';
  }
  card.innerHTML=h;
}
function renderQuestionAnalysis(){
  var card=document.getElementById('card');
  document.getElementById('pBar').style.width='0%';
  document.getElementById('pText').textContent='题目分析';
  document.getElementById('swH').textContent='';
  var valid=allData.filter(function(i){return i&&i.id});
  var total=valid.length;
  var starCounts={'三星':0,'四星':0,'五星':0};
  valid.forEach(function(k){if(starCounts[k.category]!==undefined)starCounts[k.category]++});
  var chMap={};
  valid.forEach(function(k){var c=k.chapter||'未分类';if(!chMap[c])chMap[c]={'三星':0,'四星':0,'五星':0,total:0};if(chMap[c][k.category]!==undefined)chMap[c][k.category]++;chMap[c].total++});
  var chList=Object.keys(chMap).map(function(c){return{name:c,total:chMap[c].total,s3:chMap[c]['三星'],s4:chMap[c]['四星'],s5:chMap[c]['五星']}});
  chList.sort(function(a,b){return b.total-a.total});
  var h='';
  h+='<div class="st-card">';
  h+='<div class="st-title">&#128218; 题目总览</div>';
  h+='<div class="qa-summary">';
  h+='<div class="qa-sum-item"><div class="qa-sum-val" style="color:var(--accent)">'+total+'</div><div class="qa-sum-lab">总题数</div></div>';
  h+='<div class="qa-sum-item"><div class="qa-sum-val" style="color:var(--text2)">'+starCounts['三星']+'</div><div class="qa-sum-lab">三星</div></div>';
  h+='<div class="qa-sum-item"><div class="qa-sum-val" style="color:#1565c0">'+starCounts['四星']+'</div><div class="qa-sum-lab">四星</div></div>';
  h+='<div class="qa-sum-item"><div class="qa-sum-val" style="color:var(--err)">'+starCounts['五星']+'</div><div class="qa-sum-lab">五星</div></div>';
  h+='</div></div>';
  if(chList.length>0){
    h+='<div class="st-card">';
    h+='<div class="st-title">&#128200; 各章节题目分布</div>';
    h+='<div class="qa-table">';
    for(var i=0;i<chList.length;i++){
      var c=chList[i];
      h+='<div class="qa-row">';
      h+='<span class="qa-ch-name">'+esc(c.name)+'</span>';
      h+='<span class="qa-ch-count">'+c.total+'</span>';
      h+='<div class="qa-stars">';
      if(c.s3>0)h+='<span class="qa-star-tag qa-star-s3">三星 '+c.s3+'</span>';
      if(c.s4>0)h+='<span class="qa-star-tag qa-star-s4">四星 '+c.s4+'</span>';
      if(c.s5>0)h+='<span class="qa-star-tag qa-star-s5">五星 '+c.s5+'</span>';
      h+='</div></div>';
    }
    h+='</div></div>';
  }
  if(total>0){
    h+='<div class="st-card">';
    h+='<div class="st-title">&#11088; 星级占比</div>';
    var maxStar=Math.max(starCounts['三星'],starCounts['四星'],starCounts['五星']);
    var starData=[
      {name:'三星',count:starCounts['三星'],color:'#9e9e9e'},
      {name:'四星',count:starCounts['四星'],color:'#2196f3'},
      {name:'五星',count:starCounts['五星'],color:'#f44336'}
    ];
    for(var i=0;i<starData.length;i++){
      var s=starData[i];
      var pct=total>0?Math.round(s.count/total*100):0;
      var barW=maxStar>0?Math.round(s.count/maxStar*100):0;
      h+='<div class="st-dist-row">';
      h+='<span class="st-dist-label" style="color:'+s.color+'">'+s.name+'</span>';
      h+='<div class="st-dist-bar-wrap"><div class="st-dist-bar" style="width:'+barW+'%;background:'+s.color+'"></div></div>';
      h+='<span class="st-dist-count">'+s.count+'</span>';
      h+='<span style="font-size:11px;color:var(--text2);width:36px;text-align:right">'+pct+'%</span>';
      h+='</div>';
    }
    h+='</div>';
  }
  card.innerHTML=h;
}
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')nextCard();if(e.key==='ArrowLeft')prevCard();if(e.key==='Enter'){if(mode===1)checkDict();else if(mode===0)toggleReveal()}if(e.key==='e'||e.key==='E')toggleEdit();if(e.key==='r'||e.key==='R')randomCard();if(e.key==='Tab'){e.preventDefault();switchMode(mode===0?1:mode===1?2:mode===2?3:0)}});
function toggleFullscreen(){
  var el=document.documentElement;
  var isFs=document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement;
  if(!isFs){
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen)el.msRequestFullscreen();
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    else if(document.msExitFullscreen)document.msExitFullscreen();
  }
}
</script>
</body>
</html>
